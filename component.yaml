name: alhikmah
description: "ALHIKMAH - Portal Islam terpercaya untuk pendidikan, sejarah, sosial, dan budaya."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1

  # Networking
  http: ^1.2.2
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Islamic Features
  hijri: ^3.0.0
  adhan: ^2.0.0
  flutter_qiblah: ^3.0.1
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0

  # Audio (Murotal)
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Monetization (Tappx via AdMob mediation)
  google_mobile_ads: ^5.1.0

  # SEO / Web
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/fonts/

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/Scheherazade-Regular.ttf