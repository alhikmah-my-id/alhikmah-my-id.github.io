plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.my.alhikmah.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.my.alhikmah.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        resValue "string", "app_name", "ALHIKMAH"
        resValue "string", "tappx_app_key", "pub-65263-android-0300"

        manifestPlaceholders = [
            tappxAppKey: "pub-65263-android-0300",
            siteUrl: "https://alhikmah.my.id"
        ]
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "alhikmah-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "alhikmah2025"
            keyAlias System.getenv("KEY_ALIAS") ?: "alhikmah"
            keyPassword System.getenv("KEY_PASSWORD") ?: "alhikmah2025"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    bundle {
        language { enableSplit = false }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.tappx.sdk.android:tappx-sdk:4.0.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}