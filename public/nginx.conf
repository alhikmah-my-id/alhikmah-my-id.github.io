# ============================================================
# ALHIKMAH — Nginx Configuration
# Domain: alhikmah.my.id
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name alhikmah.my.id www.alhikmah.my.id;
    return 301 https://alhikmah.my.id$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alhikmah.my.id www.alhikmah.my.id;

    root /var/www/alhikmah/public;
    index index.html;

    # ---------- SSL ----------
    ssl_certificate     /etc/letsencrypt/live/alhikmah.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alhikmah.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- SECURITY HEADERS ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # ---------- GZIP ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml application/manifest+json;

    # ---------- ADS.TXT & APP-ADS.TXT (CORS) ----------
    location ~ ^/(ads\.txt|app-ads\.txt)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---------- MANIFEST & ROBOTS ----------
    location ~ ^/(manifest\.json|robots\.txt|sitemap\.xml)$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---------- APK DOWNLOAD ----------
    location ~* \.apk$ {
        add_header Content-Type "application/vnd.android.package-archive" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ---------- STATIC ASSETS (long cache) ----------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SPA FALLBACK ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- BLOCK SENSITIVE FILES ----------
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location ~* \.(py|sh|md|log|sql|bak|config)$ {
        deny all;
        return 404;
    }

    # ---------- API PROXY (opsional ke Node.js) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---------- ERROR PAGES ----------
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}